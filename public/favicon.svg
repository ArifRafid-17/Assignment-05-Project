<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient matching the pink-to-purple diagonal flow -->
    <linearGradient id="ds-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Subtle inner highlight for depth -->
    <linearGradient id="top-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle / Rounded Base Tile -->
  <rect 
    x="4" 
    y="4" 
    width="92" 
    height="92" 
    rx="26" 
    ry="26" 
    fill="url(#ds-gradient)" 
  />

  <!-- Soft Upper Gloss Overlay -->
  <rect 
    x="4" 
    y="4" 
    width="92" 
    height="46" 
    rx="26" 
    ry="26" 
    fill="url(#top-shine)" 
  />

  <!-- Bold DS Monogram Text -->
  <text 
    x="50" 
    y="63" 
    fill="#ffffff" 
    font-size="44" 
    font-weight="800" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" 
    letter-spacing="-1.5" 
    text-anchor="middle"
  >
    DS
  </text>
</svg>
